name: Build Android APK & Windows PC App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & build web app
        run: |
          npm install
          npm run build

      - name: Install Capacitor & create Android project
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          mkdir -p android/app/src/main/res/values
          cp -r android-res/mipmap-* android/app/src/main/res/
          cp android-res/values/ic_launcher_background.xml android/app/src/main/res/values/
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bills-Cave-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-windows-pc:
    name: Build Windows PC App (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & build web app
        run: |
          npm install
          npm run build

      - name: Prepare Windows icon & package EXE (Installer & Portable)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          if (!(Test-Path "build/icon.ico") -and (Test-Path "public/favicon.ico")) {
            Copy-Item "public/favicon.ico" "build/icon.ico"
          }
          if (!(Test-Path "build/icon.png") -and (Test-Path "public/pwa-512x512.png")) {
            Copy-Item "public/pwa-512x512.png" "build/icon.png"
          }
          npm install --no-save electron electron-builder
          npx electron-builder --config electron-builder.yml --win --publish never

      - name: Upload Windows EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bills-Cave-Windows-PC
          path: release-pc/*.exe
