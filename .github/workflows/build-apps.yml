name: Build Android APK & Windows PC App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web app
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Install Capacitor & create Android project
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          mkdir -p android/app/src/main/res/values
          cp -r android-res/mipmap-* android/app/src/main/res/
          cp android-res/values/ic_launcher_background.xml android/app/src/main/res/values/
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          for sm in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do [ -x "$sm" ] && yes | "$sm" --licenses >/dev/null 2>&1 || true; done
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bills-Cave-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-windows-pc:
    name: Build Windows PC App (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & build web app
        shell: bash
        run: |
          npm install --legacy-peer-deps && npm run build

      - name: Prepare Windows icon & package EXE (Installer & Portable)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          mkdir -p build
          [ -f build/icon.ico ] || cp public/favicon.ico build/icon.ico
          [ -f build/icon.png ] || cp public/pwa-512x512.png build/icon.png
          npm install --no-save --legacy-peer-deps electron electron-builder
          npx electron-builder --config electron-builder.yml --win --publish never

      - name: Upload Windows EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bills-Cave-Windows-PC
          path: release-pc/*.exe
